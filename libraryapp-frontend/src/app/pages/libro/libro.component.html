<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Libro" #input>
</mat-form-field>


<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="idLibro">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.idLibro}} </td>
    </ng-container>
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> TÍTULO </th>
      <td mat-cell *matCellDef="let row"> {{row.title}} </td>
    </ng-container>

    <ng-container matColumnDef="nameAuthor">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> AUTOR </th>
      <td mat-cell *matCellDef="let row"> {{row.nameAuthor}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ACTIONS </th>
      <td mat-cell *matCellDef="let row"> 
        <button mat-flat-button (click)="openDialog(row)">
          <span>Edit</span>
          <mat-icon>edit</mat-icon>
        </button>  

        <button mat-flat-button class="cancel-button" (click)="delete(row.idLibro)">
          <span>Delete</span>
          <mat-icon>delete</mat-icon>
        </button>  
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

   <mat-paginator [pageSizeOptions]="[2, 10, 25, 100]" 
   [length]="$totalElements()"
  [pageSize]="$pageRequest().size"
  (page)="changePage($event)"
   aria-label="Select page of medics"></mat-paginator>

   <button mat-fab style="float: right;" (click)="openDialog()" >
      <mat-icon>add</mat-icon>
   </button>
  
</div>
