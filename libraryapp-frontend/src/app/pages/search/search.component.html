<form [formRoot]="searchForm.$form" (submit)="search()">
  <mat-tab-group #tabs>
    <mat-tab label="Por cliente">
      <div class="tab-content">
        <mat-form-field>
          <mat-label>Cédula</mat-label>
          <input matInput placeholder="Cédula" [formField]="searchForm.$form.cedula" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Nombre o apellido</mat-label>
          <input matInput placeholder="Nombre o apellido" [formField]="searchForm.$form.fullname" />
        </mat-form-field>
      </div>
    </mat-tab>

    <mat-tab label="Por fecha">
      <div class="tab-content">
        <mat-form-field>
          <mat-label>Rango de fechas</mat-label>
          <mat-date-range-input [rangePicker]="picker">
            <input matStartDate placeholder="Inicio" [formField]="searchForm.$form.startDate" />
            <input matEndDate placeholder="Fin" [formField]="searchForm.$form.endDate" />
          </mat-date-range-input>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>
      </div>
    </mat-tab>
  </mat-tab-group>

  <div class="search-actions">
    <button mat-flat-button type="submit">
      <span>Buscar</span>
      <mat-icon>search</mat-icon>
    </button>
  </div>
</form>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef> CLIENTE </th>
      <td mat-cell *matCellDef="let row"> {{ row.cliente?.nombres }} {{ row.cliente?.apellidos }} </td>
    </ng-container>

    <ng-container matColumnDef="libro">
      <th mat-header-cell *matHeaderCellDef> LIBRO </th>
      <td mat-cell *matCellDef="let row"> {{ libroTitles(row) }} </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> FECHA </th>
      <td mat-cell *matCellDef="let row"> {{ row.fechaReserva | date:'dd/MM/yyyy HH:mm' }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> ACTIONS </th>
      <td mat-cell *matCellDef="let row">
        <button mat-flat-button (click)="viewDetails(row)">
          <span>Ver detalle</span>
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
